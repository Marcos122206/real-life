<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center">

    <!-- Cabeçalho Bonito e Moderno -->
    <header class="w-full bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center max-w-xl shadow-lg sticky top-0 z-50">
        <h1 class="text-xl font-extrabold bg-gradient-to-r from-indigo-400 to-pink-500 bg-clip-text text-transparent">Real Life 🌍</h1>
        <div class="flex items-center gap-2">
            <span class="text-xs text-slate-400">Próximo post em:</span>
            <div id="timer" class="text-sm font-mono font-bold bg-indigo-600/30 border border-indigo-500/50 text-indigo-300 px-3 py-1 rounded-full">
                10:00
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="w-full max-w-xl p-4 flex flex-col gap-4 mb-10">

        <!-- Caixa de Pesquisa de Usuários para Seguir -->
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-md">
            <input type="text" id="pesquisa-usuarios" placeholder="🔍 Pesquisar usuários para seguir..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            <div id="lista-resultados-busca" class="mt-2 flex flex-col gap-1"></div>
        </div>

        <!-- Formulário de Postagem -->
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-md">
            <h2 class="font-semibold text-slate-200 mb-3 text-sm tracking-wide uppercase">Criar Momento</h2>
            <form id="form-post" onsubmit="enviarPost(event)" class="flex flex-col gap-3">
                <input type="file" id="imagem-input" accept="image/*" required class="text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                <input type="text" id="legenda-input" placeholder="O que está acontecendo agora?" class="p-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <button type="submit" class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-2.5 rounded-xl font-bold shadow-lg hover:opacity-90 transition">Publicar</button>
            </form>
        </div>

        <!-- Feed de Posts -->
        <div id="feed" class="flex flex-col gap-4">
            <!-- Os posts aparecem aqui dinamicamente -->
        </div>

    </main>

    <!-- Script com Temporizador de 10 Minutos e Conexões -->
    <script>
        const socket = io();
        let usuarioLogado = localStorage.getItem('usuarioLogado') || prompt('Digite seu nome de usuário:') || 'Convidado';
        localStorage.setItem('usuarioLogado', usuarioLogado);

        // --- TEMPORIZADOR DE 10 MINUTOS ---
        function iniciarTemporizador() {
            const elementoTimer = document.getElementById('timer');
            if (!elementoTimer) return;

            // Define 10 minutos em segundos (10 * 60 = 600 segundos)
            let tempoRestante = 600; 

            // Tenta pegar o tempo salvo ou inicia do zero
            const salvo = localStorage.getItem('tempo_real_life');
            if (salvo) {
                const diff = Math.floor((Date.now() - Number(salvo)) / 1000);
                tempoRestante = Math.max(0, 600 - (diff % 600));
            } else {
                localStorage.setItem('tempo_real_life', Date.now());
            }

            setInterval(() => {
                tempoRestante--;
                if (tempoRestante < 0) tempoRestante = 600; // Reinicia o ciclo de 10 min

                const minutos = Math.floor(tempoRestante / 60);
                const segundos = tempoRestante % 60;

                elementoTimer.innerText = `${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // --- CARREGAR DADOS ---
        async function carregarDados() {
            try {
                const res = await fetch('/dados');
                const data = await res.json();
                renderizarFeed(data.posts);
                configurarBuscaUsuarios(data.perfis || {});
            } catch (e) {
                console.error('Erro ao carregar dados:', e);
            }
        }

        // --- RENDERIZAR FEED ---
        function renderizarFeed(posts) {
            const feed = document.getElementById('feed');
            if (!feed) return;
            feed.innerHTML = '';

            if (!posts || posts.length === 0) {
                feed.innerHTML = '<p class="text-center text-slate-500 py-6 text-sm">Nenhum post no feed ainda.</p>';
                return;
            }

            posts.forEach(post => {
                const div = document.createElement('div');
                div.className = 'bg-slate-800 border border-slate-700 rounded-2xl shadow-md p-4 overflow-hidden';
                div.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="font-bold text-indigo-400 text-sm">@${post.usuario}</span>
                        <span class="text-xs text-slate-500">${post.data}</span>
                    </div>
                    <img src="${post.imagem}" class="rounded-xl w-full object-cover max-h-96 mb-3 border border-slate-700" />
                    <p class="text-slate-300 text-sm mb-3">${post.legenda}</p>
                    <div class="flex items-center gap-4 text-sm text-slate-400 border-t border-slate-700/50 pt-3">
                        <button onclick="curtirPost(${post.id})" class="flex items-center gap-1.5 hover:text-red-400 transition">
                            ❤️ <span class="font-semibold">${post.curtidas ? post.curtidas.length : 0}</span>
                        </button>
                    </div>
                `;
                feed.appendChild(div);
            });
        }

        // --- ENVIAR POST ---
        async function enviarPost(e) {
            e.preventDefault();
            const inputImagem = document.getElementById('imagem-input');
            const inputLegenda = document.getElementById('legenda-input');

            if (!inputImagem.files[0]) {
                alert('Selecione uma imagem!');
                return;
            }

            const formData = new FormData();
            formData.append('usuario', usuarioLogado);
            formData.append('imagem', inputImagem.files[0]);
            formData.append('legenda', inputLegenda.value);

            const res = await fetch('/posts', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                inputLegenda.value = '';
                inputImagem.value = '';
                carregarDados();
            } else {
                alert('Erro ao enviar post.');
            }
        }

        // --- BUSCA DE USUÁRIOS ---
        function configurarBuscaUsuarios(perfis) {
            const inputBusca = document.getElementById('pesquisa-usuarios');
            const listaResultados = document.getElementById('lista-resultados-busca');
            if (!inputBusca || !listaResultados) return;

            inputBusca.oninput = (e) => {
                const termo = e.target.value.toLowerCase();
                listaResultados.innerHTML = '';
                if (!termo) return;

                const encontrados = Object.keys(perfis).filter(u => u.toLowerCase().includes(termo) && u !== usuarioLogado);

                encontrados.forEach(usuario => {
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center p-2.5 bg-slate-900/50 hover:bg-slate-900 rounded-xl border border-slate-700/50 mt-1';
                    item.innerHTML = `
                        <span class="font-semibold text-xs text-slate-200">@${usuario}</span>
                        <button onclick="seguirUsuario('${usuario}')" class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:bg-indigo-500 transition">Seguir</button>
                    `;
                    listaResultados.appendChild(item);
                });
            };
        }

        async function seguirUsuario(alvo) {
            await fetch('/api/seguir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: usuarioLogado, alvo })
            });
            alert(`Você agora interage com @${alvo}`);
        }

        async function curtirPost(id) {
            await fetch(`/posts/${id}/curtir`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: usuarioLogado })
            });
            carregarDados();
        }

        socket.on('novo-post', () => carregarDados());
        socket.on('atualizar-posts', () => carregarDados());

        window.onload = () => {
            iniciarTemporizador();
            carregarDados();
        };
    </script>
</body>
</html>
div>

        <!-- MAIN APP -->
        <div id="main-app">
            <!-- ABA 1: FEED -->
            <div id="tab-feed" class="tab-content active">
                <div class="feed-toggle">
                    <button class="feed-tab-btn active" onclick="filtrarFeed('global', this)">Global</button>
                    <button class="feed-tab-btn" onclick="filtrarFeed('seguindo', this)">Seguindo</button>
                </div>
                <div id="feed-container">
                    <p style="text-align: center; color: var(--text-muted);">Carregando...</p>
                </div>
            </div>

            <!-- ABA 2: CÂMERA -->
            <div id="tab-camera" class="tab-content">
                <div class="card camera-box">
                    <h3>Momento Real Life</h3>
                    <div id="timer-box" class="timer-alert">
                        Próxima foto liberada em: <span id="countdown">--:--</span>
                    </div>
                    
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas" style="display:none;"></canvas>

                    <input type="text" id="cam-legenda" placeholder="O que você está fazendo agora?">
                    <button id="btn-tirar" class="main-btn" onclick="tirarFoto()" disabled>Aguarde o tempo...</button>
                </div>
            </div>

            <!-- ABA 3: RANKING -->
            <div id="tab-ranking" class="tab-content">
                <h2>Ranking de Atividade</h2>
                <div id="ranking-list" style="margin-top: 15px;"></div>
            </div>

            <!-- ABA 4: CHAT -->
            <div id="tab-chat" class="tab-content">
                <h2>Chat Global</h2>
                <div class="card" style="margin-top: 15px;">
                    <div id="chat-messages" class="chat-box"></div>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="chat-text" placeholder="Sua mensagem..." style="margin-bottom:0;">
                        <button class="main-btn" onclick="enviarMensagem()" style="width: auto;">Enviar</button>
                    </div>
                </div>
            </div>

            <!-- ABA 5: PERFIL -->
            <div id="tab-profile" class="tab-content">
                <div class="card">
                    <div class="profile-header">
                        <div class="profile-avatar" id="profile-initial">U</div>
                        <h2 id="profile-username">@usuario</h2>
                    </div>

                    <div style="text-align: center; margin-bottom: 10px; font-size: 0.85rem; color: var(--text-muted);">Cor do App:</div>
                    <div class="theme-selector">
                        <div class="theme-btn" style="background: #6366f1;" onclick="mudarCorTema('#6366f1')"></div>
                        <div class="theme-btn" style="background: #ec4899;" onclick="mudarCorTema('#ec4899')"></div>
                        <div class="theme-btn" style="background: #10b981;" onclick="mudarCorTema('#10b981')"></div>
                        <div class="theme-btn" style="background: #0ea5e9;" onclick="mudarCorTema('#0ea5e9')"></div>
                    </div>

                    <textarea id="profile-bio" placeholder="Escreva sua biografia..."></textarea>
                    <button class="main-btn" onclick="salvarPerfil()">Salvar Perfil</button>
                    
                    <h3 style="margin-top: 20px; font-size: 1rem;">Minhas Memórias 📸</h3>
                    <div id="memories-container" class="memories-grid"></div>

                    <button onclick="logout()" style="background:none; border:none; color:#ef4444; width:100%; margin-top:25px; cursor:pointer; font-weight:600;">Sair da Conta</button>
                </div>
            </div>

            <!-- NAV -->
            <nav>
                <button class="nav-btn active" onclick="mudarAba('feed', this)">Feed</button>
                <button class="nav-btn" onclick="mudarAba('camera', this)">📸 Câmera</button>
                <button class="nav-btn" onclick="mudarAba('ranking', this)">🏆 Ranking</button>
                <button class="nav-btn" onclick="mudarAba('chat', this)">💬 Chat</button>
                <button class="nav-btn" onclick="mudarAba('profile', this)">👤 Perfil</button>
            </nav>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let modoRegistro = false;
        let usuarioLogado = localStorage.getItem('rl_user') || null;
        let dadosCache = { posts: [], ranking: [], perfis: {}, seguindo: {} };
        let filtroFeedAtual = 'global';
        let tempoRestante = 0;

        if (usuarioLogado) entrarNoApp(usuarioLogado);

        function mostrarToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function alternarModoAuth() {
            modoRegistro = !modoRegistro;
            document.getElementById('auth-title').innerText = modoRegistro ? 'Criar Conta' : 'Entrar no Real Life';
            document.getElementById('auth-btn').innerText = modoRegistro ? 'Cadastrar' : 'Entrar';
            document.getElementById('switch-text').innerText = modoRegistro ? 'Fazer Login' : 'Cadastre-se';
        }

        async function executarAuth() {
            const usuario = document.getElementById('auth-user').value.trim();
            const senha = document.getElementById('auth-pass').value.trim();
            if (!usuario || !senha) return alert('Preencha os campos!');

            const rota = modoRegistro ? '/api/registro' : '/api/login';
            try {
                const res = await fetch(rota, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });
                const data = await res.json();
                if (res.ok) {
                    if (modoRegistro) {
                        alert('Conta criada com sucesso! Faça login.');
                        alternarModoAuth();
                    } else {
                        localStorage.setItem('rl_user', data.usuario);
                        entrarNoApp(data.usuario);
                    }
                } else {
                    alert(data.erro);
                }
            } catch (e) {
                alert('Erro na conexão com o servidor.');
            }
        }

        function entrarNoApp(user) {
            usuarioLogado = user;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('profile-username').innerText = '@' + user;
            document.getElementById('profile-initial').innerText = user.charAt(0).toUpperCase();
            carregarDados();
        }

        function logout() {
            localStorage.removeItem('rl_user');
            location.reload();
        }

        function mudarAba(aba, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + aba).classList.add('active');
            el.classList.add('active');

            if (aba === 'camera') iniciarCamera();
            if (aba === 'feed' || aba === 'ranking' || aba === 'profile') carregarDados();
        }

        function mudarCorTema(cor) {
            document.documentElement.style.setProperty('--primary', cor);
            fetch('/api/perfil', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: usuarioLogado, corTema: cor })
            });
        }

        let videoStream = null;
        async function iniciarCamera() {
            const video = document.getElementById('video');
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 1280 } }, 
                    audio: false 
                });
                video.srcObject = videoStream;
            } catch (e) {
                alert('Não foi possível acessar a câmera. Verifique as permissões do navegador.');
            }
        }

        function verificarTempoPostagem() {
            if (!usuarioLogado || !dadosCache.perfis[usuarioLogado]) return;
            
            const ultimoPost = dadosCache.perfis[usuarioLogado].ultimoPost || 0;
            const agora = Date.now();
            const intervaloMinimo = 10 * 60 * 1000;
            const tempoDecorrido = agora - ultimoPost;

            if (tempoDecorrido < intervaloMinimo) {
                tempoRestante = Math.ceil((intervaloMinimo - tempoDecorrido) / 1000);
            } else {
                tempoRestante = 0;
            }
        }

        setInterval(() => {
            if (tempoRestante > 0) {
                tempoRestante--;
                let min = Math.floor(tempoRestante / 60);
                let seg = tempoRestante % 60;
                const cd = document.getElementById('countdown');
                if (cd) cd.innerText = `${min}:${seg < 10 ? '0' : ''}${seg}`;
                
                const btn = document.getElementById('btn-tirar');
                if (btn) {
                    btn.disabled = true;
                    btn.innerText = 'Aguarde o tempo...';
                }
            } else {
                const tb = document.getElementById('timer-box');
                if (tb) tb.innerHTML = '🔥 HORA DE POSTAR!';
                const btn = document.getElementById('btn-tirar');
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = 'Tirar Foto & Publicar';
                }
            }
        }, 1000);

        async function tirarFoto() {
            const legenda = document.getElementById('cam-legenda').value.trim();
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('usuario', usuarioLogado);
                formData.append('legenda', legenda);
                formData.append('foto', blob, 'foto.jpg');

                const res = await fetch('/posts', { method: 'POST', body: formData });
                if (res.ok) {
                    mostrarToast('Foto salva!');
                    document.getElementById('cam-legenda').value = '';
                    mudarAba('feed', document.querySelector('.nav-btn'));
                    carregarDados();
                }
            }, 'image/jpeg');
        }

        function filtrarFeed(tipo, el) {
            filtroFeedAtual = tipo;
            document.querySelectorAll('.feed-tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderizarFeed();
        }

        async function carregarDados() {
            try {
                const res = await fetch('/dados');
                dadosCache = await res.json();

                if (dadosCache.perfis[usuarioLogado] && dadosCache.perfis[usuarioLogado].corTema) {
                    document.documentElement.style.setProperty('--primary', dadosCache.perfis[usuarioLogado].corTema);
                }

                verificarTempoPostagem();
                renderizarFeed();
                renderizarRanking();
                renderizarMemorias();

                if (dadosCache.perfis[usuarioLogado]) {
                    const bioEl = document.getElementById('profile-bio');
                    if (bioEl && !bioEl.value) bioEl.value = dadosCache.perfis[usuarioLogado].bio || '';
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderizarFeed() {
            const feed = document.getElementById('feed-container');
            feed.innerHTML = '';

            const listaSeguindo = dadosCache.seguindo[usuarioLogado] || [];
            let postsParaMostrar = dadosCache.posts;

            if (filtroFeedAtual === 'seguindo') {
                postsParaMostrar = postsParaMostrar.filter(p => listaSeguindo.includes(p.usuario) || p.usuario === usuarioLogado);
            }

            if (postsParaMostrar.length === 0) {
                feed.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top:20px;">Nenhum post por aqui.</p>';
                return;
            }

            postsParaMostrar.forEach(p => {
                const jaCurtiu = p.curtidas.includes(usuarioLogado);
                const ehEu = p.usuario === usuarioLogado;
                const estaSeguindo = listaSeguindo.includes(p.usuario);

                let btnSeguir = '';
                if (!ehEu) {
                    btnSeguir = `<button class="btn-seguir ${estaSeguindo ? 'seguindo' : ''}" onclick="alternarSeguir('${p.usuario}')">
                        ${estaSeguindo ? 'Seguindo' : 'Seguir'}
                    </button>`;
                }

                let comentariosHtml = p.comentarios.map(c => `<div class="comment"><strong>@${c.usuario}:</strong> ${c.texto}</div>`).join('');

                feed.innerHTML += `
                    <div class="post-item">
                        <div class="post-header">
                            <div>@${p.usuario} ${btnSeguir}</div>
                            <span style="font-size:0.75rem; color:var(--text-muted);">${p.criado_em}</span>
                        </div>
                        <img src="${p.foto}" class="post-img">
                        <div class="post-body">
                            <div style="margin-bottom: 8px;"><strong>@${p.usuario}:</strong> ${p.legenda}</div>
                            <div class="post-actions">
                                <button class="action-btn ${jaCurtiu ? 'liked' : ''}" onclick="curtirPost(${p.id})">
                                    ❤️ ${p.curtidas.length} Curtidas
                                </button>
                            </div>
                            <div class="comments-section">${comentariosHtml}</div>
                            <div class="comment-input-box">
                                <input type="text" id="comentario-${p.id}" placeholder="Comentar...">
                                <button class="main-btn" onclick="comentarPost(${p.id})">Enviar</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderizarRanking() {
            const rank = document.getElementById('ranking-list');
            rank.innerHTML = '';
            const listaSeguindo = dadosCache.seguindo[usuarioLogado] || [];

            dadosCache.ranking.forEach((r, index) => {
                const ehEu = r.usuario === usuarioLogado;
                const estaSeguindo = listaSeguindo.includes(r.usuario);
                let btnSeguir = '';
                if (!ehEu) {
                    btnSeguir = `<button class="btn-seguir ${estaSeguindo ? 'seguindo' : ''}" onclick="alternarSeguir('${r.usuario}')">
                        ${estaSeguindo ? 'Seguindo' : 'Seguir'}
                    </button>`;
                }

                rank.innerHTML += `
                    <div class="ranking-item">
                        <span>#${index + 1} - @${r.usuario} ${btnSeguir}</span>
                        <span style="color: var(--primary); font-weight: bold;">${r.pontos} pts</span>
                    </div>
                `;
            });
        }

        function renderizarMemorias() {
            const container = document.getElementById('memories-container');
            container.innerHTML = '';
            const minhasFotos = dadosCache.posts.filter(p => p.usuario === usuarioLogado);

            if (minhasFotos.length === 0) {
                container.innerHTML = '<p style="font-size:0.8rem; color:var(--text-muted); grid-column: span 3;">Nenhuma memória salva.</p>';
                return;
            }

            minhasFotos.forEach(p => {
                container.innerHTML += `<img src="${p.foto}" class="memory-img">`;
            });
        }

        async function alternarSeguir(alvo) {
            await fetch('/api/seguir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: usuarioLogado, alvo })
            });
            carregarDados();
        }

        async function curtirPost(id) {
            await fetch(`/posts/${id}/curtir`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: usuarioLogado })
            });
        }

        async function comentarPost(id) {
            const input = document.getElementById(`comentario-${id}`);
            const texto = input.value.trim();
            if (!texto) return;

            await fetch(`/posts/${id}/comentar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: usuarioLogado, texto })
            });
            input.value = '';
        }

        async function salvarPerfil() {
            const bio = document.getElementById('profile-bio').value;
            await fetch('/api/perfil', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: usuarioLogado, bio })
            });
            mostrarToast('Perfil salvo!');
        }

        function enviarMensagem() {
            const texto = document.getElementById('chat-text').value.trim();
            if (!texto) return;
            socket.emit('enviar-mensagem', { usuario: usuarioLogado, mensagem: texto });
            document.getElementById('chat-text').value = '';
        }

        socket.on('receber-mensagem', (data) => {
            const box = document.getElementById('chat-messages');
            box.innerHTML += `<div class="chat-msg"><strong>@${data.usuario}:</strong> ${data.mensagem}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        socket.on('notificacao', (data) => {
            if (data.usuarioDestino === usuarioLogado) mostrarToast(data.msg);
        });

        socket.on('atualizar-posts', () => carregarDados());
        socket.on('atualizar-dados', () => carregarDados());
        socket.on('novo-post', (p) => {
            carregarDados();
            if (p.usuario !== usuarioLogado) mostrarToast(`@${p.usuario} postou no Real Life! 📸`);
        });
    </script>
</body>
</html>
