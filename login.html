<html lang="pt-BR">
<head><style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Life — Entrar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <style>*{font-family:'Inter',sans-serif} .mono{font-family:'JetBrains Mono',monospace}</style>
</head>
<body class="bg-[#0a0a0b] text-zinc-100 min-h-screen flex items-center justify-center relative overflow-hidden p-4 selection:bg-violet-500/30">

    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute -top-[300px] left-1/2 -translate-x-1/2 w-[900px] h-[600px] bg-gradient-to-br from-violet-600/20 via-indigo-600/20 to-fuchsia-600/20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-200px] -left-[200px] w-[600px] h-[600px] bg-indigo-600/10 blur-[120px] rounded-full"></div>
    </div>

    <div class="w-full max-w-[420px] relative z-10">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
            <div class="h-14 w-14 rounded-[18px] bg-white text-black grid place-items-center font-extrabold text-[22px] shadow-[0_0_40px_rgba(255,255,255,0.15)]">R</div>
            <h1 class="mt-4 text-[26px] font-extrabold tracking-tight">Real Life <span class="opacity-60 font-medium">🌍</span></h1>
            <p class="text-[13px] text-zinc-500 mt-1.5 text-center leading-relaxed">Sem filtro. Sem pose. Só o que está<br>acontecendo nos próximos 10 minutos.</p>
        </div>

        <!-- Card -->
        <div class="bg-[#121214] border border-white/[0.06] rounded-[28px] p-7 shadow-[0_20px_80px_rgba(0,0,0,0.6)]">
            <div class="flex bg-[#0f0f10] border border-white/[0.06] rounded-full p-1 mb-7">
                <button id="tab-login" onclick="trocarTab('login')" class="flex-1 py-2.5 rounded-full bg-white text-black font-semibold text-[13px] transition">Entrar</button>
                <button id="tab-registro" onclick="trocarTab('registro')" class="flex-1 py-2.5 rounded-full text-zinc-500 font-medium text-[13px] hover:text-zinc-300 transition">Criar conta</button>
            </div>

            <form id="form-auth" onsubmit="handleAuth(event)" class="flex flex-col gap-3.5">
                <div class="flex flex-col gap-1.5">
                    <label class="text-[11px] font-bold uppercase tracking-[0.08em] text-zinc-500 ml-1">Usuário</label>
                    <input id="usuario" type="text" required minlength="3" placeholder="ex: marcos.henrique" class="w-full px-4 py-3.5 bg-[#1a1a1e] border border-white/[0.06] rounded-[14px] text-[14px] placeholder-zinc-600 focus:outline-none focus:border-violet-500/50 focus:ring-4 focus:ring-violet-500/10 transition">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-[11px] font-bold uppercase tracking-[0.08em] text-zinc-500 ml-1">Senha</label>
                    <input id="senha" type="password" required minlength="4" placeholder="••••••••" class="w-full px-4 py-3.5 bg-[#1a1a1e] border border-white/[0.06] rounded-[14px] text-[14px] placeholder-zinc-600 focus:outline-none focus:border-violet-500/50 focus:ring-4 focus:ring-violet-500/10 transition">
                </div>

                <div id="msg" class="hidden text-[13px] px-4 py-3 rounded-[12px]"></div>

                <button id="btn-submit" type="submit" class="mt-2 w-full bg-white text-black py-3.5 rounded-[14px] font-bold text-[14px] tracking-tight hover:bg-zinc-100 active:scale-[0.98] transition flex items-center justify-center gap-2">
                    <span id="btn-text">Entrar no Real Life</span> <span>↗</span>
                </button>

                <p class="text-center text-[11px] text-zinc-600 mt-2 leading-relaxed">Ao continuar, você concorda em ser 100% real.<br>Sem edição, sem fake.</p>
            </form>
        </div>

        <p class="text-center text-[11px] text-zinc-600 mt-6">© 2025 Real Life • BeReal vibes</p>
    </div>

    <script>
        let modo = 'login';
        const tabLogin = document.getElementById('tab-login');
        const tabRegistro = document.getElementById('tab-registro');
        const btnText = document.getElementById('btn-text');
        const msg = document.getElementById('msg');

        // Se já logado, vai pro feed
        if(localStorage.getItem('usuarioLogado')){
            window.location.href = '/';
        }

        function trocarTab(novo){
            modo = novo;
            if(modo === 'login'){
                tabLogin.className = 'flex-1 py-2.5 rounded-full bg-white text-black font-semibold text-[13px] transition';
                tabRegistro.className = 'flex-1 py-2.5 rounded-full text-zinc-500 font-medium text-[13px] hover:text-zinc-300 transition';
                btnText.innerText = 'Entrar no Real Life';
            } else {
                tabRegistro.className = 'flex-1 py-2.5 rounded-full bg-white text-black font-semibold text-[13px] transition';
                tabLogin.className = 'flex-1 py-2.5 rounded-full text-zinc-500 font-medium text-[13px] hover:text-zinc-300 transition';
                btnText.innerText = 'Criar conta real';
            }
            esconderMsg();
        }

        function mostrarMsg(texto, erro=false){
            msg.classList.remove('hidden');
            msg.className = `text-[13px] px-4 py-3 rounded-[12px] border ${erro ? 'bg-red-500/10 border-red-500/20 text-red-300' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-300'}`;
            msg.innerText = texto;
        }
        function esconderMsg(){ msg.classList.add('hidden'); }

        async function handleAuth(e){
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-submit');
            
            btn.disabled = true;
            btnText.innerText = modo === 'login' ? 'Entrando...' : 'Criando...';
            esconderMsg();

            try{
                const endpoint = modo === 'login' ? '/api/login' : '/api/registro';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({usuario, senha})
                });
                const data = await res.json();

                if(!res.ok){
                    mostrarMsg(data.erro || 'Erro', true);
                    btn.disabled = false;
                    btnText.innerText = modo === 'login' ? 'Entrar no Real Life' : 'Criar conta real';
                    return;
                }

                if(modo === 'registro'){
                    mostrarMsg('Conta criada! Fazendo login...', false);
                    // auto login após registro
                    const loginRes = await fetch('/api/login', {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({usuario, senha})
                    });
                    if(loginRes.ok){
                        localStorage.setItem('usuarioLogado', usuario);
                        setTimeout(()=> window.location.href='/', 600);
                    }
                } else {
                    localStorage.setItem('usuarioLogado', data.usuario);
                    mostrarMsg('Bem-vindo de volta! Redirecionando...', false);
                    setTimeout(()=> window.location.href='/', 600);
                }

            }catch(err){
                mostrarMsg('Sem conexão com servidor. Verifique se o server.js está rodando.', true);
                btn.disabled = false;
                btnText.innerText = modo === 'login' ? 'Entrar no Real Life' : 'Criar conta real';
            }
        }
    </script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
